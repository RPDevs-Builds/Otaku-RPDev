repos:
  - repo: local
    hooks:
      - id: otaku-ruff
        name: Ruff static analysis (Otaku ruleset)
        entry: ruff check --select E9,F63,F7,F82,F811,F405,F541 plugin.video.otaku.rpdev context.otaku.rpdev service.subtitles.otaku.rpdev tests scripts
        language: system
        pass_filenames: false
      - id: otaku-compileall
        name: Python bytecode compileall
        entry: python3 -m compileall -q plugin.video.otaku.rpdev context.otaku.rpdev service.subtitles.otaku.rpdev tests scripts
        language: system
        pass_filenames: false
      - id: otaku-ast-integrity
        name: AST integrity guardrails
        entry: python3 -W default -m unittest tests/lint/test_ast_integrity.py
        language: system
        pass_filenames: false
      - id: otaku-docs-lint
        name: Documentation & customization lint
        entry: python3 -W default -m unittest tests/lint/test_docs_and_customizations.py
        language: system
        pass_filenames: false
      - id: otaku-suite-quality
        name: Anti-placeholder test suite quality lint
        entry: python3 -W default -m unittest tests/lint/test_suite_quality.py
        language: system
        pass_filenames: false
