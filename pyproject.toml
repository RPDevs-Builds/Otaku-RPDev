[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py", "suite_*.py"]
python_classes = ["Test*", "Suite*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "default",
    "error::DeprecationWarning:resources.*",
    "error::ResourceWarning:resources.*",
]
markers = [
    "lint: Static AST, suite quality, and documentation drift linters",
    "unit: Hermetic unit tests across dual Kodi 21/22 profiles",
    "integration: Cross-subsystem offline integration workflows",
    "e2e: Opaque-box Tier 1-4 E2E regression suites (tests/e2e_v630)",
    "property: Hypothesis property-based and adversarial fuzz tests",
    "benchmark: Hot-path performance micro-benchmarks",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811", "F405", "F541"]

[tool.coverage.run]
branch = true
source = [
    "plugin.video.otaku.rpdev/resources/lib",
    "context.otaku.rpdev",
    "service.subtitles.otaku.rpdev",
]
omit = [
    "tests/*",
    "scripts/*",
]
