name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14-dev']
    continue-on-error: ${{ matrix.python-version == '3.14-dev' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies & Lint Tools
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4 pyqrcode ruff

      - name: Static Analysis (ruff)
        run: |
          ruff check --select E9,F63,F7,F82 plugin.video.otaku.rpdev context.otaku.rpdev tests scripts

      - name: Validate Python Syntax (compileall)
        run: |
          python3 -m compileall plugin.video.otaku.rpdev context.otaku.rpdev tests scripts

      - name: Run Test Suite & AST Integrity Checks
        run: |
          python3 -W default -m unittest discover tests

      - name: Function Coverage Audit
        run: |
          python3 scripts/audit_function_coverage.py --fail-below 60
