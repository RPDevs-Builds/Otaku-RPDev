name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14-dev']
    continue-on-error: ${{ matrix.python-version == '3.14-dev' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies & Lint Tools
        run: |
          pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Unified Multi-Silo Verification Gate & E2E Suite (parallel)
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            V_ARGS="--skip-coverage --verbose"
          else
            V_ARGS="--fail-below 65 --verbose"
          fi
          RC=0
          python3 scripts/verify_all.py $V_ARGS &
          PID_V=$!
          sleep 0.5
          python3 scripts/e2e_v630_suite.py &
          PID_E=$!
          wait $PID_V || RC=$?
          wait $PID_E || RC=$?
          exit $RC
